<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meu Pratinho</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1>🍛 Meu Pratinho</h1>

<input
type="text"
id="nome"
placeholder="Nome do Cliente"
>

<input
type="text"
id="endereco"
placeholder="Endereço"
>

<select
id="pagamento"
onchange="verificarPagamento()"
>

<option>Dinheiro</option>
<option>Pix</option>
<option>Cartão</option>

</select>

<div id="trocoDiv" class="hidden">

<input
type="number"
id="troco"
placeholder="Troco para quanto?"
>

</div>

<select id="arroz">

<option>Arroz Branco</option>
<option>Baião Normal</option>
<option>Baião Mole</option>
<option>Não Quero</option>

</select>

<textarea
id="misturas"
placeholder="Misturas"
></textarea>

<h3>Adicionais</h3>

<label>
<input
type="checkbox"
class="adicional"
value="Batata Frita"
>
Batata Frita
</label>

<label>
<input
type="checkbox"
class="adicional"
value="Chips de Macaxeira"
>
Chips de Macaxeira
</label>

<label>
<input
type="checkbox"
class="adicional"
value="Farofa"
>
Farofa
</label>

<label>
<input
type="checkbox"
class="adicional"
value="Salada"
>
Salada
</label>

<label>
<input
type="checkbox"
class="adicional"
value="Macarrão Refogado"
>
Macarrão Refogado
</label>

<label>
<input
type="checkbox"
class="adicional"
value="Cuscuz Nordestino"
>
Cuscuz Nordestino
</label>

<h3>Refrigerante</h3>

<select
id="refrigerante"
onchange="verificarRefri()"
>

<option value="Nao">
Não
</option>

<option value="Sim">
Sim
</option>

</select>

<div id="tipoRefriDiv" class="hidden">

<input
type="text"
id="tipoRefri"
placeholder="Qual refrigerante?"
>

</div>

<input
type="number"
id="total"
placeholder="Total R$"
>

<button onclick="adicionarCarrinho()">
Adicionar Pratinho
</button>

<h3>Carrinho</h3>

<div id="carrinho"></div>

<h2 id="totalCarrinho">
TOTAL: R$ 0,00
</h2>

<textarea
id="observacao"
placeholder="Observação"
></textarea>

<button onclick="finalizarPedido()">
FINALIZAR PEDIDO
</button>

<div class="historico">

<h3>
Histórico de Pedidos
</h3>

<div id="listaPedidos"></div>

<button onclick="imprimirHistorico()">
Imprimir Histórico
</button>

<button onclick="salvarHistorico()">
Salvar Histórico
</button>

<button onclick="limparHistorico()">
Limpar Histórico
</button>

</div>

</div>

<div id="printArea"></div>

<script src="app.js"></script>

</body>
</html>
